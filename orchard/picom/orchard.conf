# picom — эффекты темы Orchard: мягкие тени, скруглённые углы, плавное появление.
# Бэкенд xrender работает на любой видеокарте, включая старые Intel.
# На машине с нормальным OpenGL можно заменить на "glx" — будет плавнее.

backend = "xrender";
vsync = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# --- Тени (чуть ниже окна, как в macOS) ---
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.28;
shadow-offset-x = -16;
shadow-offset-y = -10;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "class_g = 'Plank'",
  "class_g = 'Conky'",
  "class_g = 'TaskBar'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Скругление углов ---
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'Plank'",
  "class_g = 'TaskBar'"
];

# --- Плавное появление и закрытие ---
fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;
fade-delta = 5;
no-fading-openclose = false;

wintypes:
{
  tooltip       = { shadow = false; fade = true; opacity = 0.97; };
  dock          = { shadow = false; clip-shadow-above = true; };
  dnd           = { shadow = false; };
  popup_menu    = { shadow = true; opacity = 0.98; };
  dropdown_menu = { shadow = true; opacity = 0.98; };
};
